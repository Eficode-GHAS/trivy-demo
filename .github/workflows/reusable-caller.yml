name: Trivy IaC Scan (reusable)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy-reusable.yml
    with:
      scan_ref: '.'
      severity: 'CRITICAL,HIGH'
      fail_on_severity: 'NONE'
  sonarqube:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/sonar-reusable.yml
